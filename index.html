<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cocktail Flashcards</title>
<link rel="stylesheet" href="card.css">
<link rel="stylesheet" href="print.css">
<style>
  body { margin: 0; background: #2a2a2a; color: #ddd; font-family: 'Barlow', sans-serif; display: flex; min-height: 100vh; }
  .sidebar {
    position: sticky; top: 0; align-self: flex-start; height: 100vh; box-sizing: border-box; overflow-y: auto;
    width: 250px; flex: 0 0 250px; background: #1a1a1a; border-right: 1px solid #000; padding: 18px 18px 24px; font-size: 14px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .sidebar h2 { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #888; }
  .sidebar section { display: flex; flex-direction: column; gap: 6px; }
  .sidebar label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .sidebar .sub { color: #777; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; margin: 6px 0 2px; }
  .sidebar input[type=search] { width: 100%; box-sizing: border-box; background: #111; color: #eee; border: 1px solid #444; padding: 6px 8px; font: inherit; }
  .sidebar .count { color: #888; }
  .sidebar .export { margin-top: auto; }
  .sidebar button { width: 100%; background: #b5312a; color: #fff; border: 0; padding: 10px 12px; font: inherit; font-weight: 600; cursor: pointer; border-radius: 3px; }
  .sidebar button:hover { background: #d13a31; }
  .list { flex: 1 1 auto; display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; justify-content: center; align-content: flex-start; }
  .pair { display: flex; gap: 12px; align-items: flex-start; }
  .card { box-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .card.overflow { outline: 2px solid #ff0; }
  .hidden { display: none !important; }
  /* Phone and narrow windows: filters become a drawer, cards scale to the viewport width. */
  .drawer-toggle { display: none; }
  @media (max-width: 900px) {
    body { flex-direction: column; }
    .drawer-toggle {
      display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 11;
      background: #1a1a1a; color: #eee; border: 0; border-bottom: 1px solid #000; padding: 12px 16px; font: inherit; font-size: 15px; width: 100%; text-align: left;
    }
    .drawer-toggle .count { color: #888; }
    .drawer-toggle .drawer-label { display: flex; align-items: center; gap: 12px; }
    .drawer-toggle .hamburger { flex: none; }
    /* The drawer is a fixed panel under the header, so it opens in view no matter how far down the list you are */
    .sidebar { position: fixed; top: var(--drawer-top, 47px); left: 0; right: 0; bottom: 0; z-index: 12; width: auto; height: auto; overflow-y: auto; overscroll-behavior: contain; border-right: 0; gap: 14px; padding-bottom: 40px; }
    .sidebar section { flex-direction: row; flex-wrap: wrap; gap: 6px 18px; }
    .sidebar section h2, .sidebar section .sub, .sidebar input[type=search] { flex-basis: 100%; }
    .sidebar.collapsed { display: none; }
    .sidebar section:first-child .count { display: none; }
    .sidebar .export { margin-top: 0; }
    .list { padding: 16px 0; gap: 16px; }
    /* zoom scales the 5x3in cards to fit: --card-scale is set from the viewport width by script */
    .pair { zoom: var(--card-scale, 1); flex-wrap: wrap; justify-content: center; }
  }
  /* Lightbox: tap a card to focus on it; swipe or arrow keys to move through the visible cards */
  .list .card { cursor: zoom-in; }
  .lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; touch-action: none; overscroll-behavior: contain; }
  body.lb-open { position: fixed; left: 0; right: 0; overflow: hidden; }
  .lightbox.open { display: flex; }
  .lightbox .stage { position: relative; transform-origin: center center; }
  .lightbox .stage .card { box-shadow: 0 8px 40px rgba(0,0,0,.8); cursor: default; }
  .lightbox .bar { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; color: #ddd; font-size: 14px; }
  .lightbox .bar button, .lightbox .nav { background: rgba(255,255,255,.1); color: #fff; border: 0; border-radius: 4px; padding: 8px 12px; font: inherit; cursor: pointer; }
  .lightbox .bar button:hover, .lightbox .nav:hover { background: rgba(255,255,255,.2); }
  .lightbox .nav { position: fixed; top: 50%; transform: translateY(-50%); font-size: 22px; padding: 14px 12px; }
  .lightbox .nav.prev { left: 8px; } .lightbox .nav.next { right: 8px; }
  .lightbox .pos { color: #888; }
  @media (max-width: 900px) { .lightbox .nav { display: none; } }
  @media print { .sidebar, .drawer-toggle, .lightbox { display: none !important; } body { background: #fff; display: block; } }
</style>
</head>
<body>
<button class="drawer-toggle" id="drawerToggle" type="button" aria-expanded="false" aria-controls="sidebar">
  <span class="drawer-label"><svg class="hamburger" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Filters &amp; options</span>
  <span class="count" id="countMobile"></span>
</button>
<aside class="sidebar collapsed" id="sidebar">
  <section>
    <h2>Search</h2>
    <input type="search" id="q" placeholder="Name or ingredient">
    <span class="count" id="count"></span>
  </section>
  <section>
    <h2>Sort</h2>
    <label><input type="radio" name="sort" value="name" checked> Name</label>
    <label><input type="radio" name="sort" value="popularity"> Popularity</label>
    <label><input type="radio" name="sort" value="category"> Category</label>
  </section>
  <section>
    <h2>Sides</h2>
    <label><input type="checkbox" id="showFront" checked> Front</label>
    <label><input type="checkbox" id="showBack"> Back</label>
  </section>
  <section>
    <h2>Units</h2>
    <label><input type="radio" name="unit" value="oz" checked> US ounces</label>
    <label><input type="radio" name="unit" value="ml"> Millilitres (IBA)</label>
  </section>
  <section>
    <h2>Card</h2>
    <label><input type="checkbox" id="photos" checked> Photos</label>
    <label><input type="checkbox" id="punch" checked> Hole punch guide</label>
    <label><input type="checkbox" id="dark"> Dark theme (ink hog)</label>
  </section>
  <section>
    <h2>Popularity</h2>
    <label><input type="checkbox" class="tier" value="core" checked> Core</label>
    <label><input type="checkbox" class="tier" value="common" checked> Common</label>
    <label><input type="checkbox" class="tier" value="rare" checked> Rare</label>
  </section>
  <section>
    <h2>Categories</h2>
    <div class="sub">IBA official</div>
    <label><input type="checkbox" class="cat" value="the-unforgettables" checked> The Unforgettables</label>
    <label><input type="checkbox" class="cat" value="contemporary-classics" checked> Contemporary Classics</label>
    <label><input type="checkbox" class="cat" value="new-era-drinks" checked> New Era Drinks</label>
    <div class="sub">Not IBA</div>
    <label><input type="checkbox" class="cat" value="simple-drinks" checked> Simple Drinks</label>
    <label><input type="checkbox" class="cat" value="other-classics" checked> Other Classics</label>
    <label><input type="checkbox" class="cat" value="zero-proof" checked> Zero Proof</label>
    <label><input type="checkbox" class="cat" value="regional" checked> Regional</label>
  </section>
  <div class="export"><button id="exportPdf">Export PDF</button></div>
</aside>
<div class="list" id="list"></div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Card viewer">
  <div class="bar"><span class="pos" id="lbPos"></span><span><button type="button" id="lbFlip">Flip</button> <button type="button" id="lbClose" aria-label="Close">✕</button></span></div>
  <button type="button" class="nav prev" id="lbPrev" aria-label="Previous">‹</button>
  <div class="stage" id="lbStage"></div>
  <button type="button" class="nav next" id="lbNext" aria-label="Next">›</button>
</div>

<script src="data.js"></script>
<script src="cards.js"></script>
<script>
  const list = document.getElementById('list');
  const Cards = window.Cards;

  // ---- Persist every control in the sidebar across reloads (per browser, via localStorage).
  const STORE_KEY = 'cocktail-flashcards.settings';
  const controls = () => [...sidebar.querySelectorAll('input')];
  const controlKey = (el) => el.type === 'radio' ? `${el.name}=${el.value}` : (el.id || `${el.className}=${el.value}`);
  function saveSettings() {
    try {
      const s = {};
      for (const el of controls()) s[controlKey(el)] = el.type === 'search' ? el.value : el.checked;
      localStorage.setItem(STORE_KEY, JSON.stringify(s));
    } catch (e) { /* private mode or storage blocked: settings just don't persist */ }
  }
  function restoreSettings() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (!s) return;
      for (const el of controls()) {
        const k = controlKey(el);
        if (!(k in s)) continue;
        if (el.type === 'search') el.value = s[k]; else el.checked = s[k];
      }
    } catch (e) { /* ignore unreadable storage */ }
  }
  const sidebar = document.getElementById('sidebar');
  restoreSettings();
  document.documentElement.dataset.theme = dark.checked ? 'dark' : '';
  document.documentElement.classList.toggle('no-photo', !photos.checked);
  document.documentElement.classList.toggle('no-punch', !punch.checked);
  Cards.setUnit(document.querySelector('input[name=unit]:checked').value);
  sidebar.addEventListener('input', saveSettings);
  sidebar.addEventListener('change', saveSettings);

  const TIER_ORDER = { core: 0, common: 1, rare: 2 };
  const CAT_ORDER = ['the-unforgettables', 'contemporary-classics', 'new-era-drinks', 'simple-drinks', 'other-classics', 'zero-proof', 'regional'];
  const SORTS = {
    name: (a, b) => a.name.localeCompare(b.name),
    // tier first, then Drinks International rank (unranked last), then name
    popularity: (a, b) => TIER_ORDER[a.tier] - TIER_ORDER[b.tier] || (a.di_rank || 999) - (b.di_rank || 999) || a.name.localeCompare(b.name),
    category: (a, b) => CAT_ORDER.indexOf(a.category) - CAT_ORDER.indexOf(b.category) || a.name.localeCompare(b.name),
  };
  function sortKey() { return document.querySelector('input[name=sort]:checked').value; }

  function render() {
  const ordered = [...window.COCKTAILS].sort(SORTS[sortKey()]);
  list.innerHTML = ordered.map((c) => `
    <div class="pair" data-slug="${c.slug}" data-cat="${c.category}" data-tier="${c.tier}" data-text="${(c.name + ' ' + c.ingredients.join(' ')).toLowerCase().replace(/"/g, '')}">
      <div class="side front-side">${Cards.frontHTML(c)}</div>
      <div class="side back-side hidden">${Cards.backHTML(c)}</div>
    </div>`).join('');
  }
  render();

  function refit() {
    Cards.fitCards(list);
    update();
  }

  function update() {
    const f = showFront.checked, b = showBack.checked, q = document.getElementById('q').value.toLowerCase();
    const cats = new Set([...document.querySelectorAll('.cat:checked')].map((c) => c.value));
    const tiers = new Set([...document.querySelectorAll('.tier:checked')].map((c) => c.value));
    let n = 0;
    for (const pair of list.children) {
      const vis = cats.has(pair.dataset.cat) && tiers.has(pair.dataset.tier) && (!q || pair.dataset.text.includes(q));
      pair.classList.toggle('hidden', !vis);
      if (vis) n++;
      pair.querySelector('.front-side').classList.toggle('hidden', !f);
      pair.querySelector('.back-side').classList.toggle('hidden', !b);
    }
    document.getElementById('count').textContent = `${n} / ${window.COCKTAILS.length}`;
    document.getElementById('countMobile').textContent = `${n} / ${window.COCKTAILS.length}`;
  }

  dark.addEventListener('change', () => { document.documentElement.dataset.theme = dark.checked ? 'dark' : ''; });
  for (const id of ['showFront', 'showBack', 'q']) document.getElementById(id).addEventListener('input', update);
  for (const c of document.querySelectorAll('.cat, .tier')) c.addEventListener('change', update);
  photos.addEventListener('change', () => { document.documentElement.classList.toggle('no-photo', !photos.checked); refit(); });
  punch.addEventListener('change', () => { document.documentElement.classList.toggle('no-punch', !punch.checked); refit(); });
  for (const r of document.querySelectorAll('input[name=unit]')) r.addEventListener('change', () => { Cards.setUnit(r.value); render(); refit(); });
  for (const r of document.querySelectorAll('input[name=sort]')) r.addEventListener('change', () => { render(); refit(); });

  // ---- Export PDF: lay the visible cards out 4-up on US Letter and open the print dialog ----
  // Slot geometry (inches) must match print.css.
  const SLOTS = [[1.25, 0.5], [4.25, 0.5], [1.25, 5.5], [4.25, 5.5]];
  const SLOT_W = 3, SLOT_H = 5, MARK = 0.2, GAP = 0.05;

  function cropMarks(x, y) {
    const corners = [[x, y, -1, -1], [x + SLOT_W, y, 1, -1], [x, y + SLOT_H, -1, 1], [x + SLOT_W, y + SLOT_H, 1, 1]];
    return corners.map(([cx, cy, dx, dy]) => {
      const hx = dx < 0 ? cx - GAP - MARK : cx + GAP;
      const vy = dy < 0 ? cy - GAP - MARK : cy + GAP;
      return `<div class="mark h" style="left:${hx}in;top:${cy}in"></div><div class="mark v" style="left:${cx}in;top:${vy}in"></div>`;
    }).join('');
  }

  function buildSheets(cards, mirror) {
    let html = '';
    for (let i = 0; i < cards.length; i += 4) {
      const group = cards.slice(i, i + 4);
      // Mirror columns for backs so duplex (long-edge flip) lines up with the fronts.
      const order = mirror ? [1, 0, 3, 2] : [0, 1, 2, 3];
      html += '<div class="sheet">';
      order.forEach((src, slot) => {
        const [x, y] = SLOTS[slot];
        html += cropMarks(x, y);
        html += `<div class="slot" style="left:${x}in;top:${y}in">${group[src] ? group[src].outerHTML : ''}</div>`;
      });
      html += '</div>';
    }
    return html;
  }

  function exportPdf() {
    const visible = [...list.children].filter((p) => !p.classList.contains('hidden'));
    const fronts = showFront.checked ? visible.map((p) => p.querySelector('.card.front')) : [];
    const backs = showBack.checked ? visible.map((p) => p.querySelector('.card.back')) : [];
    if (!fronts.length && !backs.length) return;
    let printRoot = document.getElementById('print');
    if (!printRoot) { printRoot = document.createElement('div'); printRoot.id = 'print'; document.body.appendChild(printRoot); }
    printRoot.innerHTML = buildSheets(fronts, false) + buildSheets(backs, true);
    window.print();
  }
  document.getElementById('exportPdf').addEventListener('click', exportPdf);
  window.addEventListener('afterprint', () => { const p = document.getElementById('print'); if (p) p.remove(); });

  // ---- Lightbox
  const lb = document.getElementById('lightbox'), lbStage = document.getElementById('lbStage'), lbPos = document.getElementById('lbPos');
  let lbItems = [], lbIndex = 0, lbSide = 'front';
  function visiblePairs() { return [...list.querySelectorAll('.pair:not(.hidden)')]; }
  function lbShow(i, side) {
    lbItems = visiblePairs();
    if (!lbItems.length) return;
    lbIndex = (i + lbItems.length) % lbItems.length;
    const pair = lbItems[lbIndex];
    const src = pair.querySelector(side === 'back' ? '.card.back' : '.card.front') || pair.querySelector('.card');
    lbSide = src.classList.contains('back') ? 'back' : 'front';
    lbStage.innerHTML = '';
    lbStage.appendChild(src.cloneNode(true));
    lbPos.textContent = `${lbIndex + 1} / ${lbItems.length}`;
    lbFit();
    if (!lb.classList.contains('open')) {
      // iOS Safari ignores overflow:hidden on body, so pin the page in place and restore the scroll on close
      lbScrollY = window.scrollY;
      document.body.style.top = `-${lbScrollY}px`;
      document.body.classList.add('lb-open');
      lb.classList.add('open');
    }
  }
  let lbScrollY = 0;
  function lbFit() {
    const card = lbStage.firstElementChild; if (!card) return;
    const w = 5 * 96, hgt = 3 * 96;                      // card size in CSS px
    const s = Math.min((window.innerWidth - 24) / w, (window.innerHeight - 90) / hgt);
    lbStage.style.transform = `scale(${s.toFixed(3)})`;
  }
  function lbClose() {
    lb.classList.remove('open'); lbStage.innerHTML = '';
    document.body.classList.remove('lb-open'); document.body.style.top = '';
    window.scrollTo(0, lbScrollY);
  }
  // Swallow every touch move while the viewer is open so nothing underneath scrolls
  lb.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  list.addEventListener('click', (e) => {
    const card = e.target.closest('.card'); if (!card) return;
    const pair = card.closest('.pair');
    lbShow(visiblePairs().indexOf(pair), card.classList.contains('back') ? 'back' : 'front');
  });
  document.getElementById('lbClose').addEventListener('click', lbClose);
  document.getElementById('lbPrev').addEventListener('click', () => lbShow(lbIndex - 1, lbSide));
  document.getElementById('lbNext').addEventListener('click', () => lbShow(lbIndex + 1, lbSide));
  document.getElementById('lbFlip').addEventListener('click', () => lbShow(lbIndex, lbSide === 'front' ? 'back' : 'front'));
  lb.addEventListener('click', (e) => { if (e.target === lb) lbClose(); });
  document.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') lbClose();
    else if (e.key === 'ArrowRight') lbShow(lbIndex + 1, lbSide);
    else if (e.key === 'ArrowLeft') lbShow(lbIndex - 1, lbSide);
    else if (e.key === ' ' || e.key === 'f') { e.preventDefault(); lbShow(lbIndex, lbSide === 'front' ? 'back' : 'front'); }
  });
  // Swipe: horizontal to move between cards, tap on the card to flip it
  let touchX = null, touchY = null;
  lb.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, { passive: true });
  lb.addEventListener('touchend', (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
    touchX = touchY = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) lbShow(lbIndex + (dx < 0 ? 1 : -1), lbSide);
    else if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && e.target.closest('.stage')) lbShow(lbIndex, lbSide === 'front' ? 'back' : 'front');
  }, { passive: true });
  window.addEventListener('resize', lbFit);

  // Drawer and card scaling for narrow screens
  const narrow = window.matchMedia('(max-width: 900px)');
  const drawerToggle = document.getElementById('drawerToggle');
  function setDrawer(open) {
    sidebar.classList.toggle('collapsed', !open);
    drawerToggle.setAttribute('aria-expanded', String(open));
    document.documentElement.style.setProperty('--drawer-top', drawerToggle.offsetHeight + 'px');
  }
  drawerToggle.addEventListener('click', () => setDrawer(sidebar.classList.contains('collapsed')));
  // Export closes the drawer so the print dialog opens over the cards, not the menu
  document.getElementById('exportPdf').addEventListener('click', () => { if (narrow.matches) setDrawer(false); });
  function applyLayout() {
    if (narrow.matches) {
      const cardPx = 5 * 96 + 32;               // 5in card plus side gutters
      const s = Math.min(1, (window.innerWidth) / cardPx);
      document.documentElement.style.setProperty('--card-scale', s.toFixed(3));
    } else {
      document.documentElement.style.removeProperty('--card-scale');
      sidebar.classList.remove('collapsed');
    }
  }
  if (!narrow.matches) sidebar.classList.remove('collapsed');
  window.addEventListener('resize', applyLayout);
  narrow.addEventListener('change', applyLayout);
  applyLayout();

  // Fit once the webfont has loaded, otherwise measurements are off.
  document.fonts.ready.then(() => {
    refit();
    const m = location.hash.match(/^#print=(front|back|both)/);
    if (m) {
      showFront.checked = m[1] !== 'back';
      showBack.checked = m[1] !== 'front';
      if (/nophoto/.test(location.hash)) { photos.checked = false; document.documentElement.classList.add('no-photo'); }
      if (/nopunch/.test(location.hash)) { punch.checked = false; document.documentElement.classList.add('no-punch'); }
      if (/\bml\b/.test(location.hash)) { document.querySelector('input[name=unit][value=ml]').checked = true; Cards.setUnit('ml'); render(); }
      refit();
      update();
      const realPrint = window.print; window.print = () => {};
      exportPdf();
      window.print = realPrint;
      document.body.dataset.printReady = '1';
    }
  });
</script>
</body>
</html>
