<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cocktail Flashcards</title>
<link rel="stylesheet" href="vendor/bootstrap.min.css">
<link rel="stylesheet" href="card.css?v=2">
<link rel="stylesheet" href="print.css?v=2">
<style>
  :root { --bs-body-font-family: 'Barlow', system-ui, sans-serif; }
  body { background: #2a2a2a; }
  /* Sidebar: static column from lg up, Bootstrap offcanvas below */
  #sidebar { background: #1a1a1a; }
  @media (min-width: 992px) { #sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid #000; } }
  #sidebar h2 { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #888; margin: 0 0 6px; }
  #sidebar .sub { color: #777; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; margin: 6px 0 2px; flex-basis: 100%; }
  #sidebar section { margin-bottom: 18px; }
  #sidebar .checks { display: flex; flex-wrap: wrap; column-gap: 18px; }
  @media (min-width: 992px) { #sidebar .checks { flex-direction: column; } }
  #sidebar .form-check { margin-bottom: 4px; }
  .list { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; justify-content: center; align-content: flex-start; }
  .pair { display: flex; gap: 12px; align-items: flex-start; }
  .flashcard { box-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .flashcard.overflow { outline: 2px solid #ff0; }
  .hidden { display: none !important; }
  @media (max-width: 991.98px) {
    .list { padding: 16px 0; gap: 16px; }
    /* zoom scales the 5x3in cards to fit: --card-scale is set from the viewport width by script */
    .pair { zoom: var(--card-scale, 1); flex-wrap: wrap; justify-content: center; }
  }
  /* Lightbox: tap a card to focus on it; swipe or arrow keys to move through the visible cards */
  .list .flashcard { cursor: zoom-in; }
  .lightbox { position: fixed; inset: 0; z-index: 1100; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; touch-action: none; overscroll-behavior: contain; }
  body.lb-open { position: fixed; left: 0; right: 0; overflow: hidden; }
  .lightbox.open { display: flex; }
  .lightbox .stage { position: relative; transform-origin: center center; }
  .lightbox .stage .flashcard { box-shadow: 0 8px 40px rgba(0,0,0,.8); cursor: default; }
  .lightbox .bar { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; color: #ddd; }
  .lightbox .lb-nav { position: fixed; top: 50%; transform: translateY(-50%); font-size: 22px; }
  .lightbox .lb-nav.prev { left: 8px; } .lightbox .lb-nav.next { right: 8px; }
  @media (max-width: 991.98px) { .lightbox .lb-nav { display: none; } }
  @media print { .navbar, #sidebar, .lightbox { display: none !important; } body { background: #fff; } }
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark sticky-top d-lg-none border-bottom border-black">
  <div class="container-fluid">
    <button class="navbar-toggler me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Filters and options"><span class="navbar-toggler-icon"></span></button>
    <span class="navbar-text me-auto text-light">Filters &amp; options</span>
    <span class="navbar-text text-secondary" id="countMobile"></span>
  </div>
</nav>
<div class="container-fluid">
  <div class="row">
    <aside class="col-lg-3 col-xl-2 offcanvas-lg offcanvas-start text-light p-lg-3" id="sidebar" tabindex="-1" aria-labelledby="sidebarLabel">
      <div class="offcanvas-header d-lg-none">
        <h5 class="offcanvas-title" id="sidebarLabel">Filters &amp; options</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body d-block">
        <section>
          <h2>Search</h2>
          <input type="search" class="form-control form-control-sm bg-black text-light border-secondary" id="q" placeholder="Name or ingredient">
          <div class="text-secondary small mt-1" id="count"></div>
        </section>
        <section>
          <h2>Sort</h2>
          <div class="checks">
            <div class="form-check"><input class="form-check-input" type="radio" name="sort" id="sortName" value="name" checked><label class="form-check-label" for="sortName">Name</label></div>
            <div class="form-check"><input class="form-check-input" type="radio" name="sort" id="sortPop" value="popularity"><label class="form-check-label" for="sortPop">Popularity</label></div>
            <div class="form-check"><input class="form-check-input" type="radio" name="sort" id="sortCat" value="category"><label class="form-check-label" for="sortCat">Category</label></div>
          </div>
        </section>
        <section>
          <h2>Sides</h2>
          <div class="checks">
            <div class="form-check"><input class="form-check-input" type="checkbox" id="showFront" checked><label class="form-check-label" for="showFront">Front</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="showBack"><label class="form-check-label" for="showBack">Back</label></div>
          </div>
        </section>
        <section>
          <h2>Units</h2>
          <div class="checks">
            <div class="form-check"><input class="form-check-input" type="radio" name="unit" id="unitOz" value="oz" checked><label class="form-check-label" for="unitOz">US ounces</label></div>
            <div class="form-check"><input class="form-check-input" type="radio" name="unit" id="unitMl" value="ml"><label class="form-check-label" for="unitMl">Millilitres (IBA)</label></div>
          </div>
        </section>
        <section>
          <h2>Card</h2>
          <div class="checks">
            <div class="form-check"><input class="form-check-input" type="checkbox" id="photos" checked><label class="form-check-label" for="photos">Photos</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="punch" checked><label class="form-check-label" for="punch">Hole punch guide</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="dark"><label class="form-check-label" for="dark">Dark theme (ink hog)</label></div>
          </div>
        </section>
        <section>
          <h2>Popularity</h2>
          <div class="checks">
            <div class="form-check"><input class="form-check-input" type="checkbox" name="tier" id="tierCore" value="core" checked><label class="form-check-label" for="tierCore">Core</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="tier" id="tierCommon" value="common" checked><label class="form-check-label" for="tierCommon">Common</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="tier" id="tierRare" value="rare" checked><label class="form-check-label" for="tierRare">Rare</label></div>
          </div>
        </section>
        <section>
          <h2>Categories</h2>
          <div class="checks">
            <div class="sub">IBA official</div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="cat" id="cat1" value="the-unforgettables" checked><label class="form-check-label" for="cat1">The Unforgettables</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="cat" id="cat2" value="contemporary-classics" checked><label class="form-check-label" for="cat2">Contemporary Classics</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="cat" id="cat3" value="new-era-drinks" checked><label class="form-check-label" for="cat3">New Era Drinks</label></div>
            <div class="sub">Not IBA</div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="cat" id="cat4" value="simple-drinks" checked><label class="form-check-label" for="cat4">Simple Drinks</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="cat" id="cat5" value="other-classics" checked><label class="form-check-label" for="cat5">Other Classics</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="cat" id="cat6" value="zero-proof" checked><label class="form-check-label" for="cat6">Zero Proof</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="cat" id="cat7" value="regional" checked><label class="form-check-label" for="cat7">Regional</label></div>
          </div>
        </section>
        <button class="btn btn-danger w-100 fw-semibold" id="exportPdf">Export PDF</button>
      </div>
    </aside>
    <main class="col-lg-9 col-xl-10 px-0">
      <div class="list" id="list"></div>
    </main>
  </div>
</div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Card viewer">
  <div class="bar"><span class="text-secondary" id="lbPos"></span><span><button type="button" class="btn btn-sm btn-outline-light" id="lbFlip">Flip</button> <button type="button" class="btn btn-sm btn-outline-light" id="lbClose" aria-label="Close">✕</button></span></div>
  <button type="button" class="btn btn-outline-light lb-nav prev" id="lbPrev" aria-label="Previous">‹</button>
  <div class="stage" id="lbStage"></div>
  <button type="button" class="btn btn-outline-light lb-nav next" id="lbNext" aria-label="Next">›</button>
</div>

<script src="vendor/bootstrap.bundle.min.js"></script>
<script src="data.js?v=2"></script>
<script src="cards.js?v=2"></script>
<script>
  const list = document.getElementById('list');
  const Cards = window.Cards;

  // ---- Persist every control in the sidebar across reloads (per browser, via localStorage).
  const STORE_KEY = 'cocktail-flashcards.settings';
  const controls = () => [...sidebar.querySelectorAll('input')];
  const controlKey = (el) => el.name ? `${el.name}=${el.value}` : el.id;
  function saveSettings() {
    try {
      const s = {};
      for (const el of controls()) s[controlKey(el)] = el.type === 'search' ? el.value : el.checked;
      localStorage.setItem(STORE_KEY, JSON.stringify(s));
    } catch (e) { /* private mode or storage blocked: settings just don't persist */ }
  }
  function restoreSettings() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (!s) return;
      for (const el of controls()) {
        const k = controlKey(el);
        if (!(k in s)) continue;
        if (el.type === 'search') el.value = s[k]; else el.checked = s[k];
      }
    } catch (e) { /* ignore unreadable storage */ }
  }
  const sidebar = document.getElementById('sidebar');
  restoreSettings();
  document.documentElement.dataset.theme = dark.checked ? 'dark' : '';
  document.documentElement.classList.toggle('no-photo', !photos.checked);
  document.documentElement.classList.toggle('no-punch', !punch.checked);
  Cards.setUnit(document.querySelector('input[name=unit]:checked').value);
  sidebar.addEventListener('input', saveSettings);
  sidebar.addEventListener('change', saveSettings);

  const TIER_ORDER = { core: 0, common: 1, rare: 2 };
  const CAT_ORDER = ['the-unforgettables', 'contemporary-classics', 'new-era-drinks', 'simple-drinks', 'other-classics', 'zero-proof', 'regional'];
  const SORTS = {
    name: (a, b) => a.name.localeCompare(b.name),
    // tier first, then Drinks International rank (unranked last), then name
    popularity: (a, b) => TIER_ORDER[a.tier] - TIER_ORDER[b.tier] || (a.di_rank || 999) - (b.di_rank || 999) || a.name.localeCompare(b.name),
    category: (a, b) => CAT_ORDER.indexOf(a.category) - CAT_ORDER.indexOf(b.category) || a.name.localeCompare(b.name),
  };
  function sortKey() { return document.querySelector('input[name=sort]:checked').value; }

  function render() {
  const ordered = [...window.COCKTAILS].sort(SORTS[sortKey()]);
  list.innerHTML = ordered.map((c) => `
    <div class="pair" data-slug="${c.slug}" data-cat="${c.category}" data-tier="${c.tier}" data-text="${(c.name + ' ' + c.ingredients.join(' ')).toLowerCase().replace(/"/g, '')}">
      <div class="side front-side">${Cards.frontHTML(c)}</div>
      <div class="side back-side hidden">${Cards.backHTML(c)}</div>
    </div>`).join('');
  }
  render();

  function refit() {
    Cards.fitCards(list);
    update();
  }

  function update() {
    const f = showFront.checked, b = showBack.checked, q = document.getElementById('q').value.toLowerCase();
    const cats = new Set([...document.querySelectorAll('input[name=cat]:checked')].map((c) => c.value));
    const tiers = new Set([...document.querySelectorAll('input[name=tier]:checked')].map((c) => c.value));
    let n = 0;
    for (const pair of list.children) {
      const vis = cats.has(pair.dataset.cat) && tiers.has(pair.dataset.tier) && (!q || pair.dataset.text.includes(q));
      pair.classList.toggle('hidden', !vis);
      if (vis) n++;
      pair.querySelector('.front-side').classList.toggle('hidden', !f);
      pair.querySelector('.back-side').classList.toggle('hidden', !b);
    }
    document.getElementById('count').textContent = `${n} / ${window.COCKTAILS.length}`;
    document.getElementById('countMobile').textContent = `${n} / ${window.COCKTAILS.length}`;
  }

  dark.addEventListener('change', () => { document.documentElement.dataset.theme = dark.checked ? 'dark' : ''; });
  for (const id of ['showFront', 'showBack', 'q']) document.getElementById(id).addEventListener('input', update);
  for (const c of document.querySelectorAll('input[name=cat], input[name=tier]')) c.addEventListener('change', update);
  photos.addEventListener('change', () => { document.documentElement.classList.toggle('no-photo', !photos.checked); refit(); });
  punch.addEventListener('change', () => { document.documentElement.classList.toggle('no-punch', !punch.checked); refit(); });
  for (const r of document.querySelectorAll('input[name=unit]')) r.addEventListener('change', () => { Cards.setUnit(r.value); render(); refit(); });
  for (const r of document.querySelectorAll('input[name=sort]')) r.addEventListener('change', () => { render(); refit(); });

  // ---- Export PDF: lay the visible cards out 4-up on US Letter and open the print dialog ----
  // Slot geometry (inches) must match print.css.
  const SLOTS = [[1.25, 0.5], [4.25, 0.5], [1.25, 5.5], [4.25, 5.5]];
  const SLOT_W = 3, SLOT_H = 5, MARK = 0.2, GAP = 0.05;

  function cropMarks(x, y) {
    const corners = [[x, y, -1, -1], [x + SLOT_W, y, 1, -1], [x, y + SLOT_H, -1, 1], [x + SLOT_W, y + SLOT_H, 1, 1]];
    return corners.map(([cx, cy, dx, dy]) => {
      const hx = dx < 0 ? cx - GAP - MARK : cx + GAP;
      const vy = dy < 0 ? cy - GAP - MARK : cy + GAP;
      return `<div class="crop h" style="left:${hx}in;top:${cy}in"></div><div class="crop v" style="left:${cx}in;top:${vy}in"></div>`;
    }).join('');
  }

  function buildSheets(cards, mirror) {
    let html = '';
    for (let i = 0; i < cards.length; i += 4) {
      const group = cards.slice(i, i + 4);
      // Mirror columns for backs so duplex (long-edge flip) lines up with the fronts.
      const order = mirror ? [1, 0, 3, 2] : [0, 1, 2, 3];
      html += '<div class="sheet">';
      order.forEach((src, slot) => {
        const [x, y] = SLOTS[slot];
        html += cropMarks(x, y);
        html += `<div class="slot" style="left:${x}in;top:${y}in">${group[src] ? group[src].outerHTML : ''}</div>`;
      });
      html += '</div>';
    }
    return html;
  }

  function exportPdf() {
    const visible = [...list.children].filter((p) => !p.classList.contains('hidden'));
    const fronts = showFront.checked ? visible.map((p) => p.querySelector('.flashcard.front')) : [];
    const backs = showBack.checked ? visible.map((p) => p.querySelector('.flashcard.back')) : [];
    if (!fronts.length && !backs.length) return;
    let printRoot = document.getElementById('print');
    if (!printRoot) { printRoot = document.createElement('div'); printRoot.id = 'print'; document.body.appendChild(printRoot); }
    printRoot.innerHTML = buildSheets(fronts, false) + buildSheets(backs, true);
    window.print();
  }
  document.getElementById('exportPdf').addEventListener('click', exportPdf);
  window.addEventListener('afterprint', () => { const p = document.getElementById('print'); if (p) p.remove(); });

  // ---- Lightbox
  const lb = document.getElementById('lightbox'), lbStage = document.getElementById('lbStage'), lbPos = document.getElementById('lbPos');
  let lbItems = [], lbIndex = 0, lbSide = 'front';
  function visiblePairs() { return [...list.querySelectorAll('.pair:not(.hidden)')]; }
  function lbShow(i, side) {
    lbItems = visiblePairs();
    if (!lbItems.length) return;
    lbIndex = (i + lbItems.length) % lbItems.length;
    const pair = lbItems[lbIndex];
    const src = pair.querySelector(side === 'back' ? '.flashcard.back' : '.flashcard.front') || pair.querySelector('.flashcard');
    lbSide = src.classList.contains('back') ? 'back' : 'front';
    lbStage.innerHTML = '';
    lbStage.appendChild(src.cloneNode(true));
    lbPos.textContent = `${lbIndex + 1} / ${lbItems.length}`;
    lbFit();
    if (!lb.classList.contains('open')) {
      // iOS Safari ignores overflow:hidden on body, so pin the page in place and restore the scroll on close
      lbScrollY = window.scrollY;
      document.body.style.top = `-${lbScrollY}px`;
      document.body.classList.add('lb-open');
      lb.classList.add('open');
    }
  }
  let lbScrollY = 0;
  function lbFit() {
    const card = lbStage.firstElementChild; if (!card) return;
    const w = 5 * 96, hgt = 3 * 96;                      // card size in CSS px
    const s = Math.min((window.innerWidth - 24) / w, (window.innerHeight - 90) / hgt);
    lbStage.style.transform = `scale(${s.toFixed(3)})`;
  }
  function lbClose() {
    lb.classList.remove('open'); lbStage.innerHTML = '';
    document.body.classList.remove('lb-open'); document.body.style.top = '';
    window.scrollTo(0, lbScrollY);
  }
  // Swallow every touch move while the viewer is open so nothing underneath scrolls
  lb.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  list.addEventListener('click', (e) => {
    const card = e.target.closest('.flashcard'); if (!card) return;
    const pair = card.closest('.pair');
    lbShow(visiblePairs().indexOf(pair), card.classList.contains('back') ? 'back' : 'front');
  });
  document.getElementById('lbClose').addEventListener('click', lbClose);
  document.getElementById('lbPrev').addEventListener('click', () => lbShow(lbIndex - 1, lbSide));
  document.getElementById('lbNext').addEventListener('click', () => lbShow(lbIndex + 1, lbSide));
  document.getElementById('lbFlip').addEventListener('click', () => lbShow(lbIndex, lbSide === 'front' ? 'back' : 'front'));
  lb.addEventListener('click', (e) => { if (e.target === lb) lbClose(); });
  document.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') lbClose();
    else if (e.key === 'ArrowRight') lbShow(lbIndex + 1, lbSide);
    else if (e.key === 'ArrowLeft') lbShow(lbIndex - 1, lbSide);
    else if (e.key === ' ' || e.key === 'f') { e.preventDefault(); lbShow(lbIndex, lbSide === 'front' ? 'back' : 'front'); }
  });
  // Swipe: horizontal to move between cards, tap on the card to flip it
  let touchX = null, touchY = null;
  lb.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, { passive: true });
  lb.addEventListener('touchend', (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
    touchX = touchY = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) lbShow(lbIndex + (dx < 0 ? 1 : -1), lbSide);
    else if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && e.target.closest('.stage')) lbShow(lbIndex, lbSide === 'front' ? 'back' : 'front');
  }, { passive: true });
  window.addEventListener('resize', lbFit);

  // Card scaling for narrow screens (below Bootstrap's lg breakpoint, where the sidebar is an offcanvas)
  const narrow = window.matchMedia('(max-width: 991.98px)');
  function applyLayout() {
    if (narrow.matches) {
      const cardPx = 5 * 96 + 32;               // 5in card plus side gutters
      document.documentElement.style.setProperty('--card-scale', Math.min(1, window.innerWidth / cardPx).toFixed(3));
    } else {
      document.documentElement.style.removeProperty('--card-scale');
    }
  }
  window.addEventListener('resize', applyLayout);
  narrow.addEventListener('change', applyLayout);
  applyLayout();
  // Export closes the offcanvas so the print dialog opens over the cards, not the menu
  document.getElementById('exportPdf').addEventListener('click', () => { if (narrow.matches) bootstrap.Offcanvas.getOrCreateInstance(sidebar).hide(); });

  // Fit once the webfont has loaded, otherwise measurements are off.
  document.fonts.ready.then(() => {
    refit();
    const m = location.hash.match(/^#print=(front|back|both)/);
    if (m) {
      showFront.checked = m[1] !== 'back';
      showBack.checked = m[1] !== 'front';
      if (/nophoto/.test(location.hash)) { photos.checked = false; document.documentElement.classList.add('no-photo'); }
      if (/nopunch/.test(location.hash)) { punch.checked = false; document.documentElement.classList.add('no-punch'); }
      if (/\bml\b/.test(location.hash)) { document.querySelector('input[name=unit][value=ml]').checked = true; Cards.setUnit('ml'); render(); }
      refit();
      update();
      const realPrint = window.print; window.print = () => {};
      exportPdf();
      window.print = realPrint;
      document.body.dataset.printReady = '1';
    }
  });
</script>
</body>
</html>
